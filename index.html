<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识库智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef1f6; height: 100vh; display: flex; justify-content: center;
  }
  .chat-app {
    width: 100%; max-width: 860px; height: 100vh; display: flex; flex-direction: column;
    background: #fff; box-shadow: 0 0 24px rgba(0,0,0,.06);
  }
  .chat-header {
    padding: 16px 24px; background: linear-gradient(135deg, #2563eb, #4f6ef7);
    color: #fff; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .chat-header .logo {
    width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .chat-header h1 { font-size: 17px; font-weight: 600; }
  .chat-header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .chat-body { flex: 1; overflow-y: auto; padding: 24px; background: #f7f8fb; }
  .msg-row { display: flex; margin-bottom: 18px; gap: 10px; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff;
  }
  .msg-row.ai .avatar { background: linear-gradient(135deg, #2563eb, #4f6ef7); }
  .msg-row.user .avatar { background: #64748b; }
  .bubble {
    max-width: 72%; padding: 12px 16px; border-radius: 12px; font-size: 14px;
    line-height: 1.7; word-break: break-word; white-space: pre-wrap;
  }
  .msg-row.ai .bubble { background: #fff; border: 1px solid #e5e9f2; border-top-left-radius: 4px; }
  .msg-row.user .bubble { background: #2563eb; color: #fff; border-top-right-radius: 4px; }
  .bubble.error { color: #dc2626; }
  .sources { margin-top: 8px; font-size: 12px; color: #6b7280; }
  .sources .tag {
    display: inline-block; background: #eef2ff; color: #4f46e5; border-radius: 4px;
    padding: 2px 8px; margin: 2px 4px 2px 0; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: #94a3b8;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .chat-input {
    padding: 14px 20px; border-top: 1px solid #e5e9f2; background: #fff;
    display: flex; gap: 12px; flex-shrink: 0;
  }
  .chat-input textarea {
    flex: 1; resize: none; border: 1px solid #d7dce6; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-family: inherit; line-height: 1.5;
    max-height: 120px; outline: none; transition: border-color .2s;
  }
  .chat-input textarea:focus { border-color: #2563eb; }
  .send-btn {
    align-self: flex-end; background: #2563eb; color: #fff; border: none; border-radius: 10px;
    padding: 11px 26px; font-size: 14px; cursor: pointer; transition: background .2s;
  }
  .send-btn:hover { background: #1d4ed8; }
  .send-btn:disabled { background: #b6c3e0; cursor: not-allowed; }
  .welcome { text-align: center; color: #94a3b8; font-size: 13px; margin-top: 40px; }
  .sys-note {
    text-align: center; color: #94a3b8; font-size: 12px; margin: 10px auto; max-width: 80%;
    background: #eef1f6; border-radius: 8px; padding: 6px 12px;
  }
  .sys-note.error { color: #dc2626; background: #fef2f2; }
  .upload-btn {
    align-self: flex-end; background: #fff; color: #475569; border: 1px solid #d7dce6;
    border-radius: 10px; width: 44px; height: 42px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .2s;
  }
  .upload-btn:hover { border-color: #2563eb; color: #2563eb; }
  .upload-btn.uploading { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="chat-app">
  <div class="chat-header">
    <div class="logo">🤖</div>
    <div>
      <h1>知识库智能客服</h1>
      <div class="sub">答案基于本地知识库 · 在线解答</div>
    </div>
  </div>
  <div class="chat-body" id="chatBody">
    <div class="welcome">您好，我是知识库客服助手，请描述您的问题～</div>
  </div>
  <div class="chat-input">
    <textarea id="queryInput" rows="1" placeholder="请输入您的问题，Enter 发送，Shift+Enter 换行"></textarea>
    <input type="file" id="fileInput" accept=".txt,.md,.csv,.xlsx" style="display:none" />
    <button class="upload-btn" id="uploadBtn" title="上传知识文件(txt/md/csv/xlsx)入库">📎</button>
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>

<script>
const chatBody = document.getElementById('chatBody');
const queryInput = document.getElementById('queryInput');
const sendBtn = document.getElementById('sendBtn');
let streaming = false;

function scrollToBottom() {
  chatBody.scrollTop = chatBody.scrollHeight;
}

function createMessageRow(role) {
  const welcome = chatBody.querySelector('.welcome');
  if (welcome) welcome.remove();
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'ai' ? '🤖' : '我';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(avatar);
  row.appendChild(bubble);
  chatBody.appendChild(row);
  scrollToBottom();
  return bubble;
}

function showTyping(bubble) {
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  bubble.appendChild(t);
  return t;
}

function renderSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const box = document.createElement('div');
  box.className = 'sources';
  box.innerHTML = '参考来源：' + sources
    .map(s => `<span class="tag" title="相关度 ${s.score}">${escapeHtml(s.question || '未命名条目')}</span>`)
    .join('');
  bubble.appendChild(box);
  scrollToBottom();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function addSystemNote(text, isError) {
  const welcome = chatBody.querySelector('.welcome');
  if (welcome) welcome.remove();
  const note = document.createElement('div');
  note.className = 'sys-note' + (isError ? ' error' : '');
  note.textContent = text;
  chatBody.appendChild(note);
  scrollToBottom();
}

async function uploadFile() {
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    if (streaming) { addSystemNote('请等待当前回答完成后再上传', true); return; }
    uploadBtn.classList.add('uploading');
    addSystemNote(`正在上传并入库: ${file.name} (${(file.size / 1024).toFixed(1)}KB)…`);
    try {
      const fd = new FormData();
      fd.append('file', file);
      const resp = await fetch('/upload', { method: 'POST', body: fd });
      const data = await resp.json().catch(() => null);
      if (resp.ok && data && data.success) {
        addSystemNote(`入库成功: ${data.filename} 新增 ${data.added} 条切片, 当前知识库共 ${data.total} 条`);
      } else {
        addSystemNote(`上传失败: ${(data && data.detail) || ('HTTP ' + resp.status)}`, true);
      }
    } catch (e) {
      addSystemNote('上传失败: ' + e.message, true);
    } finally {
      uploadBtn.classList.remove('uploading');
    }
  };
  fileInput.click();
}

function setStreaming(v) {
  streaming = v;
  sendBtn.disabled = v;
  sendBtn.textContent = v ? '回答中…' : '发送';
}

async function sendMessage() {
  const query = queryInput.value.trim();
  if (!query || streaming) return;

  createMessageRow('user').textContent = query;
  queryInput.value = '';
  queryInput.style.height = 'auto';
  setStreaming(true);

  const aiBubble = createMessageRow('ai');
  const typing = showTyping(aiBubble);

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let text = '';

    // 逐块读取 SSE 流, 实时渲染(打字机效果)
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 末行可能不完整, 留待下轮
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue; // 结束标记
        let msg;
        try { msg = JSON.parse(payload); } catch { continue; }
        if (msg.type === 'sources') {
          renderSources(aiBubble, msg.sources);
        } else if (msg.type === 'delta') {
          if (typing.parentNode) typing.remove();
          text += msg.content;
          // 保留来源区块: 文本插入到打字游标位置
          aiBubble.firstChild ? null : aiBubble.textContent = '';
          if (!aiBubble.querySelector('#liveText')) {
            const span = document.createElement('span');
            span.id = 'liveText';
            aiBubble.insertBefore(span, aiBubble.firstChild);
          }
          aiBubble.querySelector('#liveText').textContent = text;
          scrollToBottom();
        } else if (msg.type === 'error') {
          if (typing.parentNode) typing.remove();
          aiBubble.classList.add('error');
          aiBubble.textContent += (text ? '\n' : '') + ('[' + msg.message + ']');
        }
      }
    }
    if (typing.parentNode) typing.remove();
    if (!aiBubble.textContent.trim()) aiBubble.textContent = '暂无相关信息。';
  } catch (e) {
    if (typing.parentNode) typing.remove();
    aiBubble.classList.add('error');
    aiBubble.textContent = '连接服务失败：' + e.message;
  } finally {
    setStreaming(false);
    queryInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
document.getElementById('uploadBtn').addEventListener('click', uploadFile);
queryInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
queryInput.addEventListener('input', () => {
  queryInput.style.height = 'auto';
  queryInput.style.height = Math.min(queryInput.scrollHeight, 120) + 'px';
});
queryInput.focus();
</script>
</body>
</html>
